    <div class="la-launcher">
        <!-- launcher header : 28px black bar + logo / window controls -->
        <div class="la-header">
            <a href="https://latale.papayaplay.com/latale.do" target="_blank" class="la-logo"
                title="LaTale Official Site">
                <img src="https://static.papayaplay.com/static/assets/images/latale/renewal/common/lt_logo.png"
                    alt="LaTale" />
            </a>
            <div class="la-win-controls">
                <button type="button" class="win-btn win-refresh" title="Refresh">
                    <img src="./images/icon_win_refresh.png" alt="Refresh" />
                </button>
                <button type="button" class="win-btn win-settings" title="Settings">
                    <img src="./images/icon_win_settings.png" alt="Settings" />
                </button>
                <button type="button" class="win-btn win-min" title="Minimize">
                    <img src="./images/icon_win_min.png" alt="Minimize" />
                </button>
                <button type="button" class="win-btn win-close" title="Close">
                    <img src="./images/icon_win_close.png" alt="Close" />
                </button>
            </div>
        </div>

        <!-- home, sns icons -->
        <div class="la-sns">
            <a href="https://latale.papayaplay.com/latale.do" title="Home" target="_blank"
                class="sns-icon home-icon-wrapper">
                <svg class="home-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 3.2 2.8 11h2.7v9.3h5V14h3v6.3h5V11h2.7L12 3.2z" />
                </svg>
            </a>
            <a href="https://www.facebook.com/latalena/" title="Facebook" target="_blank"
                class="sns-icon fb-icon-wrapper">
                <img src="https://static.papayaplay.com/static/assets/images/latale/renewal/common/icon_fb.png"
                    class="fb-icon" />
            </a>
            <a href="https://www.instagram.com/lataleofficial/" title="Instagram" target="_blank"
                class="sns-icon insta-icon-wrapper">
                <img src="https://static.papayaplay.com/static/assets/images/latale/renewal/common/icon_insta.png"
                    class="insta-icon" />
            </a>
            <a href="https://www.youtube.com/user/lataletube" title="Youtube" target="_blank"
                class="sns-icon yt-icon-wrapper">
                <img src="https://static.papayaplay.com/static/assets/images/latale/renewal/common/icon_yt.png"
                    class="yt-icon" />
            </a>
            <a href="https://www.twitter.com/papaya_latale" title="Twitter" target="_blank"
                class="sns-icon twitter-icon-wrapper">
                <img src="https://static.papayaplay.com/static/assets/images/latale/renewal/common/icon_twitter.png"
                    class="twitter-icon" />
            </a>
            <a href="https://discord.com/invite/latalena" title="Discord" target="_blank"
                class="sns-icon discord-icon-wrapper">
                <img src="https://static.papayaplay.com/static/assets/images/latale/renewal/common/icon_discord.png"
                    class="discord-icon" />
            </a>
        </div>

        <div class="la-container">
            <div class="la-left">
                <div class="sl-cont"></div>
                <div class="sl-pager">
                    <button type="button" class="pager-prev la-icon-chevron-l"></button>
                    <span class="pager-count"></span>
                    <button type="button" class="pager-next la-icon-chevron-r"></button>
                </div>
            </div>
            <div class="la-right">
                <!-- 리스트 상단 배너 영역 : 개편 레이아웃에서 미사용, 임시 숨김처리
                <div class="la-right-top">
                    <div class="last-cont"></div>
                </div>
                -->
                <div class="la-right-bt">
                    <div class="la-new-cont">
                        <h1 class="title">Latest News & Updates</h1>
                        <ul class="news-ul"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- game start / update progress -->
        <div class="la-start">
            <div class="la-version">
                <p class="version-num">Version 353.1291</p>
                <p class="version-txt">You're up to date.</p>
            </div>
            <button type="button" class="start-btn is-idle">
                <span class="start-fill"></span>
                <span class="start-label">Game Start<img src="./images/icon_play.png" class="label-icon" alt="" /></span>
                <span class="start-hover"><img src="./images/icon_pause.png" alt="" /></span>
            </button>
        </div>

        <!-- settings layer popup -->
        <div class="la-settings">
            <div class="settings-popup">
                <button type="button" class="settings-close" title="Close">
                    <img src="./images/icon_win_close.png" alt="Close" />
                </button>
                <h1 class="settings-title">Settings</h1>
                <ul class="settings-ul">
                    <li>
                        <span class="set-label">Run launcher on computer startup</span>
                        <button type="button" class="set-toggle is-on">
                            <span class="toggle-txt">ON</span>
                            <span class="toggle-knob"></span>
                        </button>
                    </li>
                    <li>
                        <span class="set-label">Auto update &amp; auto launch game</span>
                        <button type="button" class="set-toggle">
                            <span class="toggle-txt">OFF</span>
                            <span class="toggle-knob"></span>
                        </button>
                    </li>
                </ul>
                <h1 class="settings-title">Policies</h1>
                <ul class="settings-ul">
                    <li>
                        <span class="set-label">Terms of Service</span>
                        <a href="#" class="policy-btn">View</a>
                    </li>
                    <li>
                        <span class="set-label">Privacy Policy</span>
                        <a href="#" class="policy-btn">View</a>
                    </li>
                    <li>
                        <span class="set-label">Game Rating</span>
                        <a href="#" class="policy-btn">View</a>
                    </li>
                    <li>
                        <span class="set-label">Game Operation Policy</span>
                        <a href="#" class="policy-btn">View</a>
                    </li>
                </ul>
            </div>
        </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.5.9/slick.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.10.6/moment.js"></script>
    <script>
        //11
        $(document).ready(function () {
            var querystring = location.search;
            console.log(querystring);

            if (querystring === '?lang=en') {
                getHomeBanner('en');
                getBanners('en');
                getNotification('en');
                // getLastNews('en'); // 리스트 상단 배너 미사용으로 임시 비활성화
            } else if (querystring === '?lang=de') {
                getHomeBanner('de');
                getBanners('de');
                getNotification('de');
                // getLastNews('en'); // 리스트 상단 배너 미사용으로 임시 비활성화
            } else if (querystring === '?lang=fr') {
                getHomeBanner('fr');
                getBanners('fr');
                getNotification('fr');
                // getLastNews('en'); // 리스트 상단 배너 미사용으로 임시 비활성화
            } else if (querystring === '?lang=pt') {
                getHomeBanner('pt');
                getBanners('pt');
                getNotification('pt');
                // getLastNews('en'); // 리스트 상단 배너 미사용으로 임시 비활성화
            } else {
                getHomeBanner('en');
                getBanners('en');
                getNotification('en');
                // getLastNews('en'); // 리스트 상단 배너 미사용으로 임시 비활성화
            }

            function getHomeBanner(lang) {
                $.ajax({
                    url: 'https://io.papayaplay.com/json.do?callback=?',
                    type: 'GET',
                    data: {
                        cm: 'Service.Board.GetBanner',
                        groupid: 9,
                        language: lang,
                    },
                    crossDomain: true,
                    dataType: 'json',
                })
                    .done(function (data) {
                        var code = data.ResultCode[0].Code;
                        console.log(data);

                        if (code == '10000') {
                            if (data.BannerList && data.BannerList.length > 0) {
                                // 업데이트 배너가 오래된 순으로 쌓여있어 마지막 항목이 최신
                                var lastBanner = data.BannerList[data.BannerList.length - 1];
                                $('.la-launcher').css('background-image', 'url(' + lastBanner.ImgUrl1 + ')');
                            }
                        } else {
                            //alert("Error Code: " + code);
                        }
                    })
                    .fail(function () {
                        console.log('error');
                    })
                    .always(function () {
                        console.log('complete');
                    });
            }

            function getBanners(lang) {
                $.ajax({
                    url: 'https://io.papayaplay.com/json.do?callback=?',
                    type: 'GET',
                    data: {
                        cm: 'Service.Board.GetBanner',
                        groupid: 10,
                        language: lang,
                    },
                    crossDomain: true,
                    dataType: 'json',
                })
                    .done(function (data) {
                        var code = data.ResultCode[0].Code;
                        console.log(data);
                        if (code == '10000') {
                            $.each(data.BannerList, function (index, item) {
                                item.ReleaseDate = moment(item.ReleaseDate).format('MMM Do, YYYY');
                                $('.sl-cont').append(
                                    '<div class="sl-item" style="background-image: url(' +
                                    item.ImgUrl1 +
                                    ')">' +
                                    '<a href="' +
                                    item.TargetUrl1 +
                                    '" target="_blank">' +
                                    '<div class="con-top"></div>' +
                                    '<div class="con-bt"></div>' +
                                    '</a>' +
                                    '</div>'
                                );
                            });

                            $('.sl-cont').on('init afterChange', function (event, slick, currentSlide) {
                                var current = (currentSlide || 0) + 1;
                                $('.sl-pager .pager-count').text(current + ' / ' + slick.slideCount);
                            });

                            $('.sl-cont').slick({
                                infinite: true,
                                slidesToShow: 1,
                                slidesToScroll: 1,
                                autoplay: true,
                                arrows: false,
                            });

                            $('.sl-pager .pager-prev').on('click', function () {
                                $('.sl-cont').slick('slickPrev');
                            });

                            $('.sl-pager .pager-next').on('click', function () {
                                $('.sl-cont').slick('slickNext');
                            });
                        } else {
                            //alert("Error Code: " + code);
                        }
                    })
                    .fail(function () {
                        console.log('error');
                    })
                    .always(function () {
                        console.log('complete');
                    });
            }

            function getLastNews(lang) {
                $.ajax({
                    url: 'https://io.papayaplay.com/json.do?callback=?',
                    type: 'GET',
                    data: {
                        cm: 'Service.Board.GetBanner',
                        groupid: 11,
                        language: lang,
                    },
                    crossDomain: true,
                    dataType: 'json',
                })
                    .done(function (data) {
                        var code = data.ResultCode[0].Code;
                        console.log(data);

                        if (code == '10000') {
                            $.each(data.BannerList, function (index, item) {
                                item.ReleaseDate = moment(item.ReleaseDate).format('MMM Do, YYYY');
                                $('.last-cont').append(
                                    '<div class="sl-item" style="background-image: url(' +
                                    item.ImgUrl1 +
                                    ')">' +
                                    '<a href="' +
                                    item.TargetUrl1 +
                                    '" target="_blank">' +
                                    '<div class="con-top"></div>' +
                                    '<div class="con-bt"></div>' +
                                    '</a>' +
                                    '</div>'
                                );
                            });
                        } else {
                            //alert("Error Code: " + code);
                        }
                    })
                    .fail(function () {
                        console.log('error');
                    })
                    .always(function () {
                        console.log('complete');
                    });
            }

            function getNotification(lang) {
                $.ajax({
                    url: 'https://io.papayaplay.com/json.do?callback=?',
                    type: 'GET',
                    data: {
                        cm: 'Account.User.GetPublicNotificationRecent',
                        serviceid1: 4,
                        serviceid2: 4,
                        language: lang,
                        itemcount: 5,
                    },
                    crossDomain: true,
                    dataType: 'json',
                })
                    .done(function (data) {
                        console.log(data);
                        var code = data.ResultCode[0].Code;

                        if (code == '10000') {
                            $.each(data.NotificationList, function (index, val) {
                                var url =
                                    'http://www.papayaplay.com/portal.do?tp=messages&amp;sid=4&amp;dataid=' +
                                    val.NotificationID;
                                $('.news-ul').append(
                                    '<li><a href="' + url + '" target="_blank">' + val.Title + '</a></li>'
                                );
                            });
                        } else {
                            //alert("Error Code: " + code);
                        }
                    })
                    .fail(function () {
                        console.log('error');
                    });
            }

            // 상단 새로고침 버튼 (최소화/닫기는 런처 쉘에서 처리)
            $('.win-refresh').on('click', function () {
                location.reload();
            });

            // 설정 레이어 팝업
            $('.win-settings').on('click', function () {
                $('.la-settings').fadeIn(200);
            });

            $('.la-settings .settings-close').on('click', function () {
                $('.la-settings').fadeOut(200);
            });

            $('.la-settings').on('click', function (e) {
                // 팝업 바깥(딤 영역) 클릭 시 닫기
                if (e.target === this) {
                    $(this).fadeOut(200);
                }
            });

            $('.set-toggle').on('click', function () {
                var isOn = $(this).toggleClass('is-on').hasClass('is-on');
                $(this).find('.toggle-txt').text(isOn ? 'ON' : 'OFF');
            });

            // 게임 시작 버튼 : 업데이트 > 다운로드 > 설치 진행 데모
            var startBtn = $('.start-btn');
            var startLabel = $('.start-label');
            var startFill = $('.start-fill');
            var hoverIcon = $('.start-hover img');
            var progTimer = null;
            var progPhase = ''; // 'update' | 'install'
            var progValue = 0;
            var progPaused = false;

            startBtn.on('click', function () {
                if (startBtn.hasClass('is-idle')) {
                    startUpdate();
                } else if (startBtn.hasClass('is-progress')) {
                    togglePause();
                }
            });

            function startUpdate() {
                startBtn.removeClass('is-idle').addClass('is-update');
                startLabel.html('Update<img src="./images/icon_refresh.png" class="label-icon spin" alt="" />');

                // 업데이트 확인 후 다운로드 시작
                setTimeout(function () {
                    progPhase = 'update';
                    progValue = 0;
                    progPaused = false;
                    hoverIcon.attr('src', './images/icon_pause.png');
                    startBtn.removeClass('is-update').addClass('is-progress');
                    renderProgress();

                    progTimer = setInterval(function () {
                        if (progPaused) return;

                        progValue += Math.random() * 2.4 + 0.4;
                        if (progValue >= 100) {
                            if (progPhase === 'update') {
                                // 다운로드 완료 > 설치 진행
                                progPhase = 'install';
                                progValue = 0;
                            } else {
                                clearInterval(progTimer);
                                finishUpdate();
                                return;
                            }
                        }
                        renderProgress();
                    }, 120);
                }, 1500);
            }

            function renderProgress() {
                var label = progPaused ? 'Paused' : progPhase === 'update' ? 'Updating' : 'Installing';
                startFill.css('width', progValue + '%');
                startLabel.text(label + ' ' + Math.floor(progValue) + '%');
            }

            function togglePause() {
                progPaused = !progPaused;
                startBtn.toggleClass('is-paused', progPaused);
                hoverIcon.attr('src', progPaused ? './images/icon_play.png' : './images/icon_pause.png');
                renderProgress();
            }

            function finishUpdate() {
                startBtn.removeClass('is-progress is-paused').addClass('is-idle');
                startFill.css('width', 0);
                startLabel.html('Game Start<img src="./images/icon_play.png" class="label-icon" alt="" />');
                $('.la-version .version-txt').text("You're up to date.");
            }
        });
    </script>
</body>
